[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MLTools"
version = "0.1.0"
description = "Friendly PyTorch tools for common machine-learning tasks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "torchvision>=0.15", "torchaudio>=2.0", "Pillow>=9.0", "tqdm>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["MLTools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
